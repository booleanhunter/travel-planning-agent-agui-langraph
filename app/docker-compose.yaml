services:
  redis:
    # Redis 8+ ships JSON, Search, Vector, TimeSeries, Bloom as core modules.
    # Redis backs the POI hybrid index and the trip-store. Agent memory is a
    # hosted service reached over HTTP via the @redis-iris/agent-memory SDK, so
    # there is no memory-server container here.
    image: redis:latest
    container_name: trip-itinerary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
