services:
  redis:
    image: redis/redis-stack:latest
    container_name: trip-itinerary-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI — useful for showing memory state on stage
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent-memory-server:
    image: redislabs/agent-memory-server:latest
    container_name: trip-itinerary-memory-server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AUTH_DISABLED: "true"  # local dev only — enable real auth for any hosted version
      # Auto-extract structured long-term memories from working-memory messages.
      # Defaults to true in the AMS image today; we set explicitly to document
      # intent + protect against image-default drift on future updates.
      ENABLE_DISCRETE_MEMORY_EXTRACTION: "true"
      ENABLE_TOPIC_EXTRACTION: "true"
      ENABLE_NER: "true"
      # Use the cheaper model for extraction — ~10x lower per-call cost, plenty
      # of quality for our demo's preference extraction.
      GENERATION_MODEL: "gpt-4o-mini"
      # Keep all memories forever during the demo — no expiry.
      FORGETTING_ENABLED: "false"
      # Compact (dedup + merge similar memories) every minute. The demo
      # benefits from snappy reconciliation — by the time a presenter says
      # "watch the agent learn", duplicate-ish preference memories from a
      # back-and-forth conversation have already collapsed.
      COMPACTION_EVERY_MINUTES: "1"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
